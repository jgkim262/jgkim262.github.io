<!-- Support for MathJax -->
<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"></script>

<!--
  Open every off-site link in a new tab so visitors keep the site open behind
  them. Applies document-wide, covering page content, the sidebar profile
  links and any nav item pointing off-site. Compares hostnames rather than
  matching on "http", so internal links such as /research/ are untouched, and
  any coauthor or paper link added later is picked up automatically.
  rel="noopener" accompanies target="_blank".
-->
<script>
  document.querySelectorAll('a[href]').forEach(function (a) {
    if (a.hostname && a.hostname !== window.location.hostname) {
      a.target = '_blank';
      a.rel = 'noopener';
    }
  });
</script>
