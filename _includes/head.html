{% include base_path %}

<meta charset="utf-8">
<meta name="google-site-verification" content="z1T2-FB267g08ZCY93AJ5vAt1Dksp_ZVugEXdIWiP3I" />
{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- Site typeface -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300..800&display=swap">

<!-- For all browsers -->
<!-- ?v=<build time> so a rebuild always produces a new URL. Without it the
     stylesheet lives at one address forever and browsers keep serving a stale
     copy long after a change has deployed. -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ site.time | date: '%s' }}">
